server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location / { try_files $uri $uri/ =404; }

    # AI Security Scanner
    location /api/ {
        proxy_pass http://scanner:4000/;
        proxy_read_timeout 120s;
    }

    # Aplicação alvo (backend vulnerável/corrigido)
    location /app/ {
        proxy_pass http://backend:3001/;
    }
}
